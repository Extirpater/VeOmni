# Full-parameter ternary QAT on one H100 80GB with >= 220 GiB available host RAM.
# Paths and mask ID are filled from the pinned preparation manifest by launch.py.
model:
  model_path: outputs/maple_idlm/model
  config_path: outputs/maple_idlm/config
  tokenizer_path: outputs/maple_idlm/tokenizer
  processor_config:
    fix_mistral_regex: false
  model_config:
    idlm_enabled: true
    idlm_initialize_mask_token: true
    idlm_block_size: 1
    idlm_clean_weight: 0.2
    idlm_auto_balance: false
    ternary_group_size: 128
    use_cache: false
  ops_implementation:
    attn_implementation: flex_attention
    moe_implementation: fused_triton
    qat_implementation: ternary
    cross_entropy_loss_implementation: liger_kernel
    rms_norm_implementation: liger_kernel
    rotary_pos_emb_implementation: eager
    swiglu_mlp_implementation: eager
    load_balancing_loss_implementation: eager
  optimizer:
    type: anyprecision_adamw
    lr: 1.0e-5
    lr_min: 1.0e-6
    lr_decay_style: cosine
    # Ten warmup updates for this 12-hour, 10000-step-capped continuation.
    lr_warmup_ratio: 0.001
    max_grad_norm: 1.0
  accelerator:
    init_device: meta
    ulysses_size: 1
    gradient_checkpointing:
      enable: true
      enable_reentrant: false
    fsdp_config:
      fsdp_mode: fsdp2
      offload: true
      offload_pin_memory: false
      forward_prefetch: false
      mixed_precision:
        enable: false
data:
  train_path: outputs/maple_idlm/train
  data_type: pretokenized
  max_seq_len: 4096
  train_size: 4500000000
  datasets_type: iterable
  dataset_repeat: true
  dataloader:
    num_workers: 0
    pin_memory: false
train:
  global_batch_size: 4
  micro_batch_size: 1
  dyn_bsz: true
  pad_to_length: true
  bsz_warmup_ratio: 0.0
  num_train_epochs: 1
  max_steps: 10000
  checkpoint:
    output_dir: outputs/maple_idlm/run
    manager: dcp
    load_path: null
    save_steps: 10
    save_epochs: 1
    save_hf_weights: false
  wandb:
    enable: true
    project: maple-idlm
    name: maple-idlm-ternary-qat
