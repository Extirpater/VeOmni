# Measured eight-H100 recipe: stride 2, fused packed experts, QAT, FSDP2.
# launch.py defaults to expandable segments and tuned Quack GEMMs; allow 160 GiB for weights rotation.
# Paths and mask ID are filled from the pinned preparation manifest by launch.py.
model:
  model_path: outputs/maple_idlm/model
  config_path: outputs/maple_idlm/config
  tokenizer_path: outputs/maple_idlm/tokenizer
  processor_config:
    fix_mistral_regex: false
  model_config:
    idlm_enabled: true
    idlm_initialize_mask_token: true
    idlm_block_size: 1
    idlm_clean_weight: 0.2
    idlm_auto_balance: false
    ternary_group_size: 128
    use_cache: false
  ops_implementation:
    attn_implementation: flash_attention_3
    moe_implementation: fused_quack
    moe_gemm_autotune: true
    qat_implementation: ternary
    cross_entropy_loss_implementation: liger_kernel
    rms_norm_implementation: liger_kernel
    rotary_pos_emb_implementation: eager
    swiglu_mlp_implementation: eager
    load_balancing_loss_implementation: eager
  optimizer:
    type: adamw
    lr: 1.0e-5
    lr_min: 1.0e-6
    lr_decay_style: cosine
    # 100 warmup updates out of 6,104 scheduled updates.
    lr_warmup_ratio: 0.0163827
    max_grad_norm: 1.0
  accelerator:
    init_device: meta
    ulysses_size: 1
    gradient_checkpointing:
      enable: true
      enable_reentrant: false
    fsdp_config:
      fsdp_mode: fsdp2
      offload: false
      offload_pin_memory: false
      forward_prefetch: false
      mixed_precision:
        enable: true
        param_dtype: bfloat16
        reduce_dtype: float32
    offload_config:
      enable_async_activation: true
      activation_offload_host_cache_limit_gb: 24.0
data:
  train_path: outputs/maple_idlm/train
  data_type: conversation
  text_keys: conversations
  max_seq_len: 4096
  train_size: 4000000000
  datasets_type: mapping
  dataset_repeat: true
  dataloader:
    num_workers: 8
    worker_num_threads: 1
    prefetch_factor: 8
    persistent_workers: true
    pin_memory: false
train:
  global_batch_size: 160
  micro_batch_size: 20
  dyn_bsz: true
  pad_to_length: true
  bsz_warmup_ratio: 0.0
  num_train_epochs: 1
  max_steps: 6104
  checkpoint:
    output_dir: outputs/maple_idlm/run
    manager: dcp
    save_optimizer: false
    load_optimizer: false
    load_path: null
    save_steps: 1000
    save_epochs: 1
    save_hf_weights: false
  wandb:
    enable: true
    project: maple-idlm
    name: maple-idlm-b1-fused-8xh100
